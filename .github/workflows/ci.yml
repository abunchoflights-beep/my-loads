name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# S0-01: pin these actions to full commit SHAs once the repo exists
# (Dependabot keeps them updated).
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          SITE_URL: http://localhost:3000

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signing key for the local stack
        run: npm run db:keys
      - name: Start the local stack with all migrations
        # Auth (JWT hook) and Storage (bucket policies) are needed; the rest isn't.
        run: npx supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor,postgres-meta
      - name: Lint schema
        run: npm run db:lint
      - name: RLS and state machine tests (pgTAP)
        run: npm run db:test
