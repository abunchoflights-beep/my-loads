name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# S0-01: pin these actions to full commit SHAs once the repo exists
# (Dependabot keeps them updated).
jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Don't install the local git hook dispatcher on CI runners.
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the migration guard can diff against the base branch.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Route types for the type checker
        run: npx next typegen
      - name: Format, lint (constitution rules) and type check
        run: npx vp check
      - name: Unit and lint-rule tests
        run: npx vp test
      - name: Migrations are append-only
        run: node scripts/check-migrations.mjs
        env:
          MIGRATIONS_BASE_REF: origin/${{ github.base_ref || 'main' }}
      - run: npm run build
        env:
          SUPABASE_URL: http://127.0.0.1:54321
          SUPABASE_PUBLISHABLE_KEY: ci-placeholder-not-a-secret
          SITE_URL: http://localhost:3000

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VP_GIT_HOOKS: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Signing key for the local stack
        run: npm run db:keys
      - name: Start the local stack with all migrations
        # Auth (JWT hook), Storage (bucket policies) and postgres-meta (type
        # generation) are needed; the rest isn't.
        run: npx supabase start -x realtime,imgproxy,mailpit,studio,edge-runtime,logflare,vector,supavisor
      - name: Lint schema
        run: npm run db:lint
      - name: RLS and state machine tests (pgTAP)
        run: npm run db:test
      - name: Generated types match the migrations (S0-08)
        if: ${{ !cancelled() }}
        run: |
          npm run db:types
          # -N makes a missing (untracked) file show up in the diff too.
          git add -N src/lib/supabase/database.types.ts
          git diff --exit-code --stat -- src/lib/supabase/database.types.ts || {
            echo "::error file=src/lib/supabase/database.types.ts::Types are stale. Run npm run db:types, or download the database-types artifact from this run, and commit the file."
            exit 1
          }
      - name: Publish the generated types
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: database-types
          path: src/lib/supabase/database.types.ts
          if-no-files-found: error
          retention-days: 7
